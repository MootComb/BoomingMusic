name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Resolve version
        id: ver
        run: |
          GRADLE_FILE="app/build.gradle.kts"

          VER=$(grep -oE 'versionName\s*=\s*"[^"]+"' "$GRADLE_FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)

          if [ -z "$VER" ]; then
            MAJOR=$(grep -oE 'versionMajor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+' || true)
            MINOR=$(grep -oE 'versionMinor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+' || true)
            PATCH=$(grep -oE 'versionPatch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+' || true)
            if [ -n "$MAJOR" ] && [ -n "$MINOR" ] && [ -n "$PATCH" ]; then
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [ -z "$VER" ]; then
            VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          fi

          if [ -z "$VER" ]; then
            echo "::error::Could not resolve version from app/build.gradle.kts or git tags"
            exit 1
          fi

          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Create signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -di > ${{ runner.temp }}/release.jks

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          VARIANT: github
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          CAP_VARIANT="$(echo ${VARIANT:0:1} | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew assemble${CAP_VARIANT}Release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoomingMusic-${{ steps.ver.outputs.value }}
          path: app/build/outputs/apk/*/release/BoomingMusic-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.value, 'alpha') || contains(steps.ver.outputs.value, 'beta') || contains(steps.ver.outputs.value, 'rc') }}
          files: |
            app/build/outputs/apk/*/release/BoomingMusic-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
